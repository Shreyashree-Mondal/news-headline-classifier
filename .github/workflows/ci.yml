name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t news-headline-classifier .
      - name: Smoke-test container
        run: |
          docker run -d -p 7860:7860 --name api news-headline-classifier
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf -X POST localhost:7860/predict \
            -H "Content-Type: application/json" \
            -d '{"headline": "Senate passes budget bill after late-night vote"}'
